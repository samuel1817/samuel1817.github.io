<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone — 3D Parkour</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="menu">
        <h1>GAMEZONE</h1>
        <p>3D PARKOUR</p>

        <button id="startButton">PLAY</button>

        <div class="controls">
            <span>W A S D</span> Pohyb
            <span>SPACE</span> Skok
            <span>MOUSE</span> Otáčanie
        </div>
    </div>

    <div id="hud">
        <div class="top">
            <strong>3D PARKOUR</strong>
            <span>TIME: <b id="timer">0.00</b></span>
        </div>

        <div id="crosshair">+</div>

        <div id="message"></div>
    </div>

    <div id="winScreen">
        <h1>LEVEL COMPLETE!</h1>
        <p>Your time</p>
        <strong id="finalTime">0.00</strong>
        <button id="restartButton">PLAY AGAIN</button>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
